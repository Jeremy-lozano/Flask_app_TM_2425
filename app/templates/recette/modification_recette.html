{% extends 'base.html' %}


{% block content%}

<div>
  <div class="retour">
    <a href="{{ url_for('recette.show_recettes')}}">Retour</a>
  </div>
  <div>
    <h1  class="title">Modification</h1>
  </div>
   
  <div id="create">
    <div id="container-create">
      <div>
                
        <form method="post" enctype="multipart/form-data" id="dynamicForm">
          <label for="titres">Nom de la recette</label>
          <input name="titres" required id="form" value="{{recette.titres}}"><br>
          
          <label for="id_categorie">Types de recettes</label>
          <select id="form" name="nom_categorie" >
          
            {% for cat in categories %}
            <option value="{{ cat.nom_categorie }}" {% if cat.nom_categorie == recette.nom_categorie %}selected{% endif %}>{{ cat.nom_categorie }}</option>
            {% endfor %}
          </select><br>
        
          <label for="description">Description</label>
          <div id="editor-description"> {{ recette.description |safe }} </div> 
          <input type="hidden" name="description" id="content_description"> <!-- Champ caché pour envoyer la valeur -->
          <br>
        
          <label for="nombre_personne">Nombre de personnes pour cette recette</label>
          <div class="button-group"> 
            <button type="button" onclick="decrease_nbr_personne()">-</button> 
            <input type="number" id="nombre_personne" name="nombre_personne" min="1" readonly  value="{{recette.nombre_personne}}"> 
            <button type="button" onclick="increase_nbr_personne()">+</button> 
          </div><br>
        
          <div class="form-group">
            <label for="nom">Ingrédients :</label>
            <input type="text" id="nomInput" placeholder="exemple : Tomate, pressez le bouton 'Ajouter'" >

            {%for ingredients in ingredients %}

            <div class="ingredient-item" data-id_ingredient="{{ingredients.id_ingredient}}">
              <div class="space-modified">
              <span>{{ingredients.nom}}</span>
              
              <button onclick="supprimerIngredient(this)" class="btn-modified">  <i class="fa-solid fa-circle-minus"></i></button>
              </div>
              <input type="text" class="quantity-input" name="quantite[]" placeholder="Quantité" value="{{ingredients.quantite}}">
              <input type="hidden" name="id_ingredient[]" value="{{ingredients.id_ingredient}}">
            </div>
            {%endfor%}
            <div id="suggestionsList"></div>
            <div id="ingredientsList"></div>
           
          </div><br>
        
          <label for="temps_preparation">Temps de préparation</label>
          <div class="button-group"> 
            <button type="button" onclick="decrease_temps_preparation()">-</button> 
            <input type="text" id="temps_preparation" name="temps_preparation" value="{{recette.temps_preparation}}" readonly> 
            <button type="button" onclick="increase_temps_preparation()">+</button> 
          </div><br>
        
          <label for="temps_cuisson">Temps de cuisson/repos</label>
          <div class="button-group"> 
            <button type="button" onclick="decrease_temps_cuisson()">-</button> 
            <input type="text" id="temps_cuisson" name="temps_cuisson" value="{{recette.temps_cuisson}}" readonly> 
            <button type="button" onclick="increase_temps_cuisson()">+</button> 
          </div><br>
        
          <label for="etapes">Étapes pour réaliser la recette</label>
          <div id="editor-etapes">{{ recette.etapes|safe  }}
            <!-- L'éditeur Quill se charge ici -->
          </div>
          <input type="hidden" name="etapes" id="content_etapes"><!-- Champ caché pour envoyer les étapes -->
          <br>
        
          <label for="difficulte">Difficulté de la recette</label>
          <select id="form" name="difficulte">
            <option value="{{recette.difficulte}}" {% if recette.difficulte == 'facile' %}selected{% endif %}>Facile</option>
            <option value="{{recette.difficulte}}" {% if recette.difficulte == 'intermediaire' %}selected{% endif %}>intermediaire</option>
            <option value="{{recette.difficulte}}" {% if recette.difficulte == 'difficile' %}selected{% endif %}>Difficile</option>
          </select><br>
        
          <label for="file" class="custom-file-upload">
            Ajouter une photo
          </label>
          <input type="file" id="file" name="file" accept="image/*" style="display: none;" onchange="previewImage(event)">
          <p id="fileName" ></p><br>
        
          <input type="submit" value="Valider" id="button-login"> <br>
        </form>
        
        <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
        

        

      </div>
    </div>
  </div>
</div>

{%endblock%}
